services:
  db:
    image: postgres:16.4-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - db:/var/lib/postgresql/data
    restart: always
    ports:
      - "5432:5432"
    #-------------server----------------
  app:
    depends_on:
      - db
    build:
      context: ./
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=https://+:443
      - Certificate__Path=/app/https/certificate.pfx
      - Certificate__Password=password
    image: app:latest
    ports:
      - "443:443"
    volumes:
      - ./App/wwwroot:/app/wwwroot
volumes:
  db:
